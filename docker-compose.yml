version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: uae-rent-backend
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
    volumes:
      - ./backend/model:/app/model
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
    container_name: uae-rent-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080
      - NEXT_PUBLIC_WEBSITE_URL=https://thehatbuddyai.space
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
